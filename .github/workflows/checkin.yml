
name: Cloud Location Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  location-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test Geolocation
        run: |
          python <<'PY'
          import json
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              context = browser.new_context(
                  geolocation={
                      "latitude": 51.5074,
                      "longitude": -0.1278,
                      "accuracy": 50
                  }
              )

              url = "https://geo-test.example/"

              context.grant_permissions(
                  ["geolocation"], origin=url
              )

              page = context.new_page()

              page.route(
                  "**/*",
                  lambda route: route.fulfill(
                      content_type="text/html",
                      body="<html><body>Location Test</body></html>"
                  )
              )

              page.goto(url)

              result = page.evaluate("""
                  () => new Promise(resolve => {
                      navigator.geolocation.getCurrentPosition(
                          p => resolve({
                              latitude: p.coords.latitude,
                              longitude: p.coords.longitude,
                              accuracy: p.coords.accuracy
                          }),
                          e => resolve({
                              error: e.message,
                              code: e.code
                          }),
                          {timeout: 10000, maximumAge: 0}
                      )
                  })
              """)

              print(json.dumps(result, indent=2))

              browser.close()

              assert abs(result.get("latitude", 0) - 51.5074) < 0.0001
              assert abs(result.get("longitude", 0) + 0.1278) < 0.0001

              print("LOCATION TEST PASSED")
          PY
