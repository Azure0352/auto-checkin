name: Auto Check-in Pro V2.7

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: '测试失败邮件（不访问网页）'
        type: boolean
        default: false
  schedule:
    # UTC：北京时间周一至周五上午
    - cron: '57 23 * * 0-4'
    - cron: '2 0 * * 1-5'
    - cron: '7 0 * * 1-5'
    - cron: '12 0 * * 1-5'
    # UTC：北京时间周一至周五晚上
    - cron: '57 11 * * 1-5'
    - cron: '7 12 * * 1-5'
    - cron: '17 12 * * 1-5'
    - cron: '27 12 * * 1-5'
    - cron: '37 12 * * 1-5'
    - cron: '47 12 * * 1-5'
    - cron: '57 12 * * 1-5'
    - cron: '7 13 * * 1-5'
    - cron: '17 13 * * 1-5'
    - cron: '27 13 * * 1-5'
    - cron: '37 13 * * 1-5'
    - cron: '47 13 * * 1-5'

permissions:
  contents: read

concurrency:
  group: checkin-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

# 这里仅保存非敏感配置。真实个人信息不写入文件。
env:
  NAME_PLACEHOLDER: '必填项，请输入'
  ID_PLACEHOLDER: '请输入'
  BUTTON_TEXT: '我来了'
  SUCCESS_TEXT: '签到成功'
  SMTP_HOST: 'smtp.qq.com'
  SMTP_PORT: '465'
  # 默认无提交测试；仅用于明确授权的独立测试环境。
  ALLOW_TEST_SUBMIT: 'false'
  SCHEDULE: ${{ github.event.schedule }}

jobs:
  auto-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Test Email
        if: github.event_name == 'workflow_dispatch' && inputs.test_email == true
        run: |
          echo '模拟失败，测试邮件，不访问网页'
          exit 1

      - name: Smart Schedule
        id: plan
        run: |
          python3 <<'PY'
          import hashlib
          import os
          import random
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          tz = ZoneInfo('Asia/Shanghai')
          now = datetime.now(tz)
          schedule = os.getenv('SCHEDULE', '')

          def output(**values):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  for key, value in values.items():
                      print(f'{key}={value}', file=f)

          print('触发类型:', os.getenv('GITHUB_EVENT_NAME'))
          print('当前北京时间:', now.isoformat())
          print('当前UTC时间:', now.astimezone(timezone.utc).isoformat())
          print('实际触发Cron:', repr(schedule))
          print('当前日期:', now.date())
          print('星期编号（周一=1）:', now.isoweekday())
          print('运行尝试编号:', os.getenv('GITHUB_RUN_ATTEMPT', '1'))

          if os.getenv('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              output(run='true', mode='manual', target='')
              print('手动无提交测试；不受工作日限制')
              raise SystemExit(0)

          if now.weekday() >= 5:
              output(run='false', mode='weekend', target='')
              print('SKIPPED：北京时间周末')
              raise SystemExit(0)
