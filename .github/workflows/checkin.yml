
name: Auto Check-in Pro V2.4

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: '是否测试失败报警邮件'
        type: boolean
        default: false

  schedule:
    # 上午候选时间段（北京时间）
    - cron: '57 23 * * *'
    - cron: '2 0 * * *'
    - cron: '7 0 * * *'
    - cron: '12 0 * * *'

    # 晚上候选时间段（北京时间）
    - cron: '57 11 * * *'
    - cron: '7 12 * * *'
    - cron: '17 12 * * *'
    - cron: '27 12 * * *'
    - cron: '37 12 * * *'
    - cron: '47 12 * * *'
    - cron: '57 12 * * *'
    - cron: '7 13 * * *'
    - cron: '17 13 * * *'
    - cron: '27 13 * * *'
    - cron: '37 13 * * *'
    - cron: '47 13 * * *'

# =========================================
# 个人信息配置区
# =========================================

env:
  CHECKIN_NAME: 'a'
  CHECKIN_ID: 'b'

  CHECKIN_URL: 'https://qr61.cn/oAX7GH/qCKSFvS'

  LATITUDE: '29.52876'
  LONGITUDE: '106.56624'
  ACCURACY: '50'

  SMTP_HOST: 'smtp.qq.com'
  SMTP_PORT: '465'
  SMTP_USER: '1511602303@qq.com'
  MAIL_TO: '1511602303@qq.com'

  BUTTON_TEXT: '我来了'
  SUCCESS_TEXT: '签到成功'

  SCHEDULE: ${{ github.event.schedule }}

permissions:
  contents: read

concurrency:
  group: auto-checkin-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  auto-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # =====================================
      # 邮件报警测试
      # =====================================

      - name: Test Email
        if: github.event_name == 'workflow_dispatch' && inputs.test_email == true
        run: |
          echo "主动模拟任务失败，测试邮件报警"
          exit 1

      # =====================================
      # 智能随机时间调度
      # =====================================

      - name: Smart Schedule
        id: plan
        run: |
          python3 <<'PY'
          import os
          import random
          import hashlib

          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Asia/Shanghai")
          now = datetime.now(TZ)

          def output(key, value):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"{key}={value}\n")

          if os.getenv("GITHUB_EVENT_NAME") == "workflow_dispatch":
              output("run", "true")
              output("mode", "manual")
              print("手动测试模式，不提交签到")
              exit(0)

          schedule = os.environ["SCHEDULE"]
          hour = int(schedule.split()[1])

          if hour in (23, 0):
              mode = "morning"
              start_hour = 8
              duration = 20
              slot_minutes = 5
          else:
              mode = "evening"
              start_hour = 20
              duration = 120
              slot_minutes = 10

          start = now.replace(
              hour=start_hour,
              minute=0,
              second=0,
              microsecond=0
          )

          seed_text = f"{now:%Y-%m-%d}-{mode}"

          seed = int(
              hashlib.sha256(
                  seed_text.encode()
              ).hexdigest(),
              16
          )

          rng = random.Random(seed)

          offset = rng.randrange(duration * 60)
          target = start + timedelta(seconds=offset)

          slot = offset // (slot_minutes * 60)

          launch = start + timedelta(
              minutes=slot * slot_minutes - 3
          )

          utc = launch.astimezone(ZoneInfo("UTC"))

          expected = f"{utc.minute} {utc.hour} * * *"
          selected = schedule == expected

          output("run", str(selected).lower())
          output("mode", mode)
          output("target", target.isoformat())

          print("=" * 45)
          print("当前日期:", now.date())
          print("任务类型:", mode)
          print("随机种子:", seed_text)
          print("目标时间:", target)
          print("是否执行:", selected)
          print("=" * 45)

          if not selected:
              print("非目标时段，直接结束")
              exit(0)

          if now >= start + timedelta(minutes=duration):
              raise RuntimeError("已错过签到时间窗口")
          PY

      # =====================================
      # Python 环境
      # =====================================

      - name: Setup Python
        if: steps.plan.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # =====================================
      # Playwright 浏览器安装
      # =====================================

      - name: Install Playwright
        if: steps.plan.outputs.run == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # =====================================
      # 自动签到核心程序
      # =====================================

      - name: Auto Check-in
        if: steps.plan.outputs.run == 'true'

        env:
          TARGET: ${{ steps.plan.outputs.target }}
          MODE: ${{ steps.plan.outputs.mode }}

        run: |
          python <<'PY'
          import os
          import re
          import time

          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from urllib.parse import urlsplit

          from playwright.sync_api import sync_playwright

          # =================================
          # 基础配置
          # =================================

          TZ = ZoneInfo("Asia/Shanghai")

          URL = os.environ["CHECKIN_URL"]

          NAME = os.environ["CHECKIN_NAME"]
          EMPLOYEE_ID = os.environ["CHECKIN_ID"]

          LATITUDE = float(os.environ["LATITUDE"])
          LONGITUDE = float(os.environ["LONGITUDE"])
          ACCURACY = float(os.environ["ACCURACY"])

          BUTTON_TEXT = os.environ["BUTTON_TEXT"]
          SUCCESS_TEXT = os.environ["SUCCESS_TEXT"]

          MODE = os.environ["MODE"]
          DRY_RUN = MODE == "manual"

          def log(message):
              now = datetime.now(TZ)

              print(
                  f"[{now:%Y-%m-%d %H:%M:%S}] {message}",
                  flush=True
              )

          def safe_url(url):
              parts = urlsplit(url)

              if parts.scheme not in ("http", "https"):
                  return parts.scheme or "unknown"

              return (
                  f"{parts.scheme}://"
                  f"{parts.hostname or ''}"
                  f"{parts.path}"
              )

          # =================================
          # 网页诊断函数
          # 不读取输入框的值
          # 不保存截图
          # =================================

          def diagnose(page):

              log("=" * 50)
              log("网页诊断开始")
              log("=" * 50)

              log(f"当前页面地址: {safe_url(page.url)}")
              log(f"页面标题: {page.title()}")
              log(f"页面框架数量: {len(page.frames)}")

              for index, frame in enumerate(page.frames):

                  log("-" * 40)
                  log(f"框架编号: {index}")
                  log(f"框架地址: {safe_url(frame.url)}")

                  try:

                      fields = frame.locator(
                          "input, textarea, select, [contenteditable='true']"
                      ).evaluate_all("""
                          elements => elements.slice(0, 40).map(e => ({
                              tag: e.tagName,
                              type: e.getAttribute('type'),
                              id: e.getAttribute('id'),
                              name: e.getAttribute('name'),
                              placeholder: e.getAttribute('placeholder'),
                              ariaLabel: e.getAttribute('aria-label'),
                              labels: Array.from(e.labels || [])
                                  .map(l => l.innerText.trim().slice(0, 80)),
                              visible: e.getClientRects().length > 0
                          }))
                      """)

                      log(
                          f"输入框数量: "
                          f"{frame.locator('input, textarea, select, [contenteditable=true]').count()}"
                      )

                      for field in fields:
                          log(f"输入框: {field}")

                      buttons = frame.locator(
                          "button, [role='button'], input[type='submit']"
                      ).evaluate_all("""
                          elements => elements.slice(0, 40).map(e => ({
                              tag: e.tagName,
                              id: e.getAttribute('id'),
                              text: (e.innerText || '').trim().slice(0, 80),
                              ariaLabel: e.getAttribute('aria-label'),
                              visible: e.getClientRects().length > 0
                          }))
                      """)

                      log(f"按钮数量: {len(buttons)}")

                      for button in buttons:
                          log(f"按钮: {button}")

                  except Exception as e:

                      log(
                          f"框架诊断异常: "
                          f"{type(e).__name__}"
                      )

              log("=" * 50)
              log("网页诊断结束")
              log("=" * 50)

          # =================================
          # 在页面和 iframe 中查找元素
          # =================================

          def find_unique(page, label, factory, timeout=25):

              deadline = time.monotonic() + timeout

              while time.monotonic() < deadline:

                  matches = []

                  for frame in page.frames:

                      if frame.is_detached():
                          continue

                      try:
                          locator = factory(frame)

                          for index in range(locator.count()):

                              item = locator.nth(index)

                              if item.is_visible():
                                  matches.append(item)

                      except Exception:
                          continue

                  if len(matches) == 1:
                      log(f"成功识别: {label}")
                      return matches[0]

                  if len(matches) > 1:
                      raise RuntimeError(
                          f"{label}存在多个匹配元素，停止操作"
                      )

                  page.wait_for_timeout(500)

              raise RuntimeError(
                  f"{label}识别超时，未找到可见元素"
              )

          # =================================
          # 时间控制
          # =================================

          if DRY_RUN:

              NAME = "a"
              EMPLOYEE_ID = "b"

              log("手动测试模式，不提交签到")

          else:

              if not NAME or not EMPLOYEE_ID:
                  raise RuntimeError("姓名或工号未填写")

              if os.getenv("GITHUB_RUN_ATTEMPT", "1") != "1":
                  raise RuntimeError("禁止重复运行定时任务")

              target = datetime.fromisoformat(
                  os.environ["TARGET"]
              )

              start = target.replace(
                  hour=8 if MODE == "morning" else 20,
                  minute=0,
                  second=0,
                  microsecond=0
              )

              end = start + timedelta(
                  minutes=20 if MODE == "morning" else 120
              )

              if datetime.now(TZ) >= end:
                  raise RuntimeError("已超出允许签到时间")

              log(f"计划执行时间: {target:%H:%M:%S}")

              prepare = target - timedelta(seconds=60)

              wait_seconds = (
                  prepare - datetime.now(TZ)
              ).total_seconds()

              if wait_seconds > 0:
                  log(f"等待 {wait_seconds:.0f} 秒")
                  time.sleep(wait_seconds)

          # =================================
          # 浏览器启动
          # =================================

          with sync_playwright() as p:

              browser = p.chromium.launch(
                  headless=True
              )

              context = browser.new_context(
                  geolocation={
                      "latitude": LATITUDE,
                      "longitude": LONGITUDE,
                      "accuracy": ACCURACY
                  },
                  permissions=["geolocation"],
                  locale="zh-CN",
                  timezone_id="Asia/Shanghai",
                  viewport={
                      "width": 1280,
                      "height": 900
                  }
              )

              page = context.new_page()
              page.set_default_timeout(20000)

              stage = "打开网页"

              try:

                  # =========================
                  # 加载网页
                  # =========================

                  log("正在打开测试网站")

                  response = page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  log("网页初始加载完成")

                  if response:

                      log(f"HTTP状态码: {response.status}")

                      if response.status >= 400:
                          raise RuntimeError("网页HTTP响应异常")

                  else:
                      log("未获得HTTP响应信息")

                  log(f"跳转后地址: {safe_url(page.url)}")
                  log(f"页面标题: {page.title()}")

                  # =========================
                  # 网页诊断
                  # =========================

                  if DRY_RUN:

                      log("等待网页动态内容加载")
                      page.wait_for_timeout(5000)

                      diagnose(page)

                  # =========================
                  # 测试浏览器定位
                  # =========================

                  stage = "定位检测"

                  position = page.evaluate("""
                      () => new Promise((resolve, reject) => {
                          navigator.geolocation.getCurrentPosition(
                              p => resolve({
                                  latitude: p.coords.latitude,
                                  longitude: p.coords.longitude,
                                  accuracy: p.coords.accuracy
                              }),
                              e => reject(new Error(e.message)),
                              {timeout: 10000}
                          );
                      })
                  """)

                  log(f"测试纬度: {position['latitude']}")
                  log(f"测试经度: {position['longitude']}")
                  log(f"定位精度: {position['accuracy']} 米")

                  if (
                      abs(position["latitude"] - LATITUDE) > 0.000001
                      or
                      abs(position["longitude"] - LONGITUDE) > 0.000001
                  ):
                      raise RuntimeError("浏览器测试坐标与配置不一致")

                  log("浏览器测试定位验证通过")

                  # =========================
                  # 查找姓名输入框
                  # =========================

                  stage = "识别姓名输入框"

                  name_input = find_unique(
                      page,
                      "姓名输入框",
                      lambda frame:
                          frame.get_by_label(
                              re.compile("姓名")
                          ).or_(
                              frame.get_by_placeholder(
                                  re.compile("姓名")
                              )
                          )
                  )

                  # =========================
                  # 查找工号输入框
                  # =========================

                  stage = "识别工号输入框"

                  id_input = find_unique(
                      page,
                      "工号输入框",
                      lambda frame:
                          frame.get_by_label(
                              re.compile("工号")
                          ).or_(
                              frame.get_by_placeholder(
                                  re.compile("工号")
                              )
                          )
                  )

                  # =========================
                  # 自动填写姓名
                  # =========================

                  stage = "填写姓名"

                  name_input.fill(NAME)

                  if name_input.input_value() != NAME:
                      raise RuntimeError("姓名填写验证失败")

                  log("姓名填写并验证成功")

                  # =========================
                  # 自动填写工号
                  # =========================

                  stage = "填写工号"

                  id_input.fill(EMPLOYEE_ID)

                  if id_input.input_value() != EMPLOYEE_ID:
                      raise RuntimeError("工号填写验证失败")

                  log("工号填写并验证成功")

                  # =========================
                  # 查找签到按钮
                  # =========================

                  stage = "识别签到按钮"

                  button = find_unique(
                      page,
                      BUTTON_TEXT,
                      lambda frame:
                          frame.get_by_role(
                              "button",
                              name=BUTTON_TEXT,
                              exact=True
                          )
                  )

                  log(f"成功找到按钮: {BUTTON_TEXT}")

                  # =========================
                  # 手动测试模式
                  # =========================

                  if DRY_RUN:

                      log("=" * 45)
                      log("网页加载：通过")
                      log("浏览器测试定位：通过")
                      log("姓名填写：通过")
                      log("工号填写：通过")
                      log("签到按钮识别：通过")
                      log("手动测试完成，未提交签到")
                      log("=" * 45)

                  else:

                      # =====================
                      # 等待随机目标时间
                      # =====================

                      remaining = (
                          target - datetime.now(TZ)
                      ).total_seconds()

                      if remaining > 0:

                          log(f"距离执行还有 {remaining:.0f} 秒")

                          page.wait_for_timeout(
                              remaining * 1000
                          )

                      now = datetime.now(TZ)

                      if not (start <= now < end):
                          raise RuntimeError("超出签到时间窗口")

                      log(f"实际执行时间: {now:%H:%M:%S}")

                      # =====================
                      # 检查提交前状态
                      # =====================

                      stage = "检查提交前状态"

                      def success_visible():

                          for frame in page.frames:

                              matches = frame.get_by_text(
                                  SUCCESS_TEXT,
                                  exact=True
                              )

                              for index in range(matches.count()):

                                  if matches.nth(index).is_visible():
                                      return True

                          return False

                      if success_visible():
                          raise RuntimeError("页面已存在成功提示")

                      # =====================
                      # 点击签到按钮
                      # =====================

                      stage = "点击签到按钮"

                      available_ms = int(
                          (end - datetime.now(TZ))
                          .total_seconds() * 1000
                      )

                      if available_ms <= 0:
                          raise RuntimeError("签到窗口已结束")

                      log(f"点击按钮: {BUTTON_TEXT}")

                      button.click(
                          timeout=min(5000, available_ms)
                      )

                      # =====================
                      # 检测签到结果
                      # =====================

                      stage = "检测签到结果"

                      deadline = time.monotonic() + 20
                      confirmed = False

                      while time.monotonic() < deadline:

                          if success_visible():
                              confirmed = True
                              break

                          page.wait_for_timeout(500)

                      if not confirmed:
                          raise RuntimeError("未检测到签到成功提示")

                      log("=" * 45)
                      log("已检测到签到成功提示")
                      log("任务类型: " + MODE)
                      log("任务执行完成")
                      log("=" * 45)

              except Exception as e:

                  log("=" * 45)
                  log(f"失败阶段: {stage}")
                  log(f"异常类型: {type(e).__name__}")
                  log("未能确认签到成功")
                  log("=" * 45)

                  if DRY_RUN:

                      try:
                          diagnose(page)
                      except Exception:
                          log("无法获取额外网页诊断信息")

                  raise RuntimeError(
                      f"{stage}失败"
                  ) from None

              finally:

                  browser.close()
                  log("浏览器已关闭")

          PY

      # =====================================
      # 失败邮件通知
      # =====================================

      - name: Send Failure Email
        if: failure()

        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

        run: |
          python3 <<'PY'
          import os
          import ssl
          import smtplib

          from email.message import EmailMessage
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(
              ZoneInfo("Asia/Shanghai")
          )

          host = os.environ["SMTP_HOST"]
          port = int(os.environ["SMTP_PORT"])

          sender = os.environ["SMTP_USER"]
          password = os.environ["SMTP_PASSWORD"]
          receiver = os.environ["MAIL_TO"]

          if not password:
              raise RuntimeError("未配置SMTP授权码")

          schedule = os.getenv("SCHEDULE", "")

          if schedule:

              hour = int(schedule.split()[1])

              if hour in (23, 0):
                  mode = "上午签到"
              else:
                  mode = "晚上任务"

          else:
              mode = "手动测试"

          repo = os.getenv("GITHUB_REPOSITORY")
          run_id = os.getenv("GITHUB_RUN_ID")

          run_url = (
              f"https://github.com/{repo}"
              f"/actions/runs/{run_id}"
          )

          msg = EmailMessage()

          msg["Subject"] = f"【签到异常提醒】{mode}失败"
          msg["From"] = sender
          msg["To"] = receiver

          msg.set_content(f"""
          Auto Check-in Pro V2.4

          自动签到任务运行异常！

          日期：{now:%Y-%m-%d}
          时间：{now:%H:%M:%S}
          任务：{mode}
          状态：未确认任务成功

          请查看GitHub Actions运行日志。

          日志地址：
          {run_url}

          本邮件由系统自动发送。
          """)

          with smtplib.SMTP_SSL(
              host,
              port,
              timeout=30,
              context=ssl.create_default_context()
          ) as server:

              server.login(sender, password)
              server.send_message(msg)

          print("失败报警邮件发送成功")
          PY
